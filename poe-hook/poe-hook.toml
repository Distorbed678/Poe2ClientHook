# poe-hook configuration (deployed next to PathOfExileSteam.exe; edits there are kept
# across redeploys). Logs: poe-hook.log next to the exe, and a folder per process under
# logs/poe-hook/<date_time>_<pid>/ (logs, packets, snapshots).

# Where generated/datamined outputs go (terrain grids/layouts, area exports, object-type and tile
# tables): <dump_dir>/terrain/{grids,layouts,area-exports/<session>}, <dump_dir>/client-tables.
# Set by `cargo xtask deploy-client` to <repo>/dumps/<version> as a Windows path (the client runs
# under Wine: `Z:` is `/`). Unset: next to the exe / in the session folder.
# dump_dir = 'Z:\home\user\Poe2ModdingProject\dumps\0.5.5e.hotfix1'

# private: our server (crypto bypass, external connections refused).
# official: official servers, read-only: the DLL only observes and logs; nothing is sent,
# altered or injected. Set by `cargo xtask deploy-client [--official]`.
mode = "private"

# standalone: the account-name + password login screen (and remembered-login token) of the
# client instead of the Steam login. The loader patches the client's platform detection before
# its first use (docs/re/standalone-login.md); needs no Steam. steam: the client as shipped.
# Always "steam" in official mode, whatever is written here. Set by `cargo xtask deploy-client`.
login_mode = "standalone"

# Servers treated like loopback (127.0.0.0/8 is always trusted): connections to them are not
# refused by block_external, do not switch the read-only latch on, and get the crypto bypass.
# Entries are IPv4 literals: "ip:port", "ip:*" (any port) or "ip". One entry per port the client
# connects to (login and instance server). Anything else is an official/external server and stays
# read-only. Always empty in official mode. Written by `cargo xtask deploy-client`.
trusted_servers = []
# The private server's page for new accounts, opened by the login screen's "Create account"
# button instead of the official site (written by the launcher at Play). Empty: the button is
# left alone. Never used in official mode.
register_url = ""

[log]
# error | warn | info | debug | trace
level = "debug"

[features]
# Log access violations and other fatal exceptions with module-relative addresses.
crash_log = true
# Replace the login key exchange (signature check + DH) with SHA-512(server public key) so
# the private server can derive the session keys. Required to log in to the private server.
# Never while read-only.
crypto_bypass = true
# Log the process's send/recv/WSASend/WSARecv calls with payload prefix and call stack
# (Ghidra addresses). Research aid; data is ciphertext once encryption is active.
net_trace = false
net_trace_dump_bytes = 256
# Private mode: refuse connections to non-loopback addresses (keeps the client away from
# official services such as the shop, telemetry and crash upload).
block_external = true
# Logging breakpoints: Ghidra addresses (function starts) to hook; each hit logs rcx/rdx/r8/r9
# and the game call stack, up to trace_limit hits per address (POE_HOOK_TRACE adds more).
trace_addresses = []
trace_limit = 20
# Research hooks on entities, frames and area loads (object-type dump, terrain layout
# export, player frame tick). Position sync and the player inspector need them.
dump_object_types = true
# Per-entity tracing (components, reader spans, terrain dumps). Slow (seconds per spawned
# entity on official servers): research only.
entity_trace = false
# Log the player's position every simulation frame (movement research; or set the
# POE_HOOK_MOVEMENT_LOG environment variable).
movement_log = false
# Report the player's position and action to the local instance server every frame (UDP to
# the instance port; the server's drift checker and debug link use them). Never while read-only.
position_sync = true
# Test input timeline [[ms, vk], ...]; tests use POE_HOOK_AUTO_KEYS instead.
auto_keys = []

[overlay]
enabled = true
# Virtual keys: Insert shows/hides the overlay, Home saves a bug-report snapshot.
toggle_key = 0x2d
snapshot_key = 0x24
snapshot_seconds = 30
visible_at_start = false
scale = 1.0

[packets]
# Plaintext capture of the login and instance connections (inside the client).
capture = true
# Replace secrets (Steam ticket, session tokens, key material) in exported files.
redact = true
# Messages kept in memory for the Packets tab (all of them go to the files).
keep = 50000

[reload]
# Reload the debug core when poe_hook_core.dll next to the exe changes.
auto = true

[gen_batch]
# In-client batch terrain generation (docs/re/terrain/batch.md in the main repository): the
# client's own generator runs a list of "area seed topology orientation" jobs on worker threads,
# with no login. Private mode only (ignored in official mode). Normally switched on by
# scripts/re/terrain_batch.py through the environment (POE_HOOK_GEN_BATCH=<run directory>,
# POE_HOOK_GEN_BATCH_THREADS=<n>), not here.
enabled = false
# Run directory (a path the game process can open, Z:\... under Proton): jobs.txt in, batch-results.tsv out.
# dir = 'Z:\home\you\poe2\dumps\0.5.5e.hotfix1\terrain\batch\run1'
threads = 4
# Seconds after the core starts before the first job.
start_delay_seconds = 20
