[package]
name = "poe-hook-mods"
description = "Host-buildable mod loader logic of the PoE2 client hook: mod.toml, state.toml, load plan, ABI check, official-mode refusal"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Package verification (zip + SHA-256). On by default for hosts (launcher, server, SDK); the
# loader DLL (poe-hook) takes the crate without it to stay small.
default = ["package"]
package = ["dep:zip", "dep:sha2"]

[dependencies]
poe-hook-mod-api.workspace = true
semver = "1"
toml.workspace = true
serde.workspace = true
sha2 = { workspace = true, optional = true }
zip = { version = "2.6", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3"
