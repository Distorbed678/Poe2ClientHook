name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read

jobs:
  host:
    # poe-hook-deploy builds and tests on the host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The nested Poe2Protocol submodule is another private repo the default token cannot read:
      # fetch it with the SUBMODULE_TOKEN secret (fine-grained PAT, contents:read on Poe2Protocol).
      - name: Fetch submodules
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Warnings are reported but do not fail the build yet.
      - run: cargo clippy -p poe-hook-deploy --all-targets -- -W clippy::all
      - run: cargo test -p poe-hook-deploy
  dll:
    # The DLL workspace, for the client's target.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The nested Poe2Protocol submodule is another private repo the default token cannot read:
      # fetch it with the SUBMODULE_TOKEN secret (fine-grained PAT, contents:read on Poe2Protocol).
      - name: Fetch submodules
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ secrets.SUBMODULE_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p poe-hook -p poe-hook-core -p poe-hook-shared --target x86_64-pc-windows-msvc
      - run: cargo test -p poe-hook-shared
      - uses: actions/upload-artifact@v4
        with:
          name: dlls
          path: |
            target/x86_64-pc-windows-msvc/release/poe_hook.dll
            target/x86_64-pc-windows-msvc/release/poe_hook_core.dll
