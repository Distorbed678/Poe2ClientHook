name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: read

jobs:
  host:
    # poe-hook-deploy builds and tests on the host.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Warnings are reported but do not fail the build yet.
      - run: cargo clippy -p poe-hook-deploy -p poe-hook-mods -p poe-hook-mod-api --all-targets -- -W clippy::all
      - run: cargo test -p poe-hook-deploy -p poe-hook-mods -p poe-hook-mod-api
      # The loader DLL takes poe-hook-mods without the package feature.
      - run: cargo check -p poe-hook-mods --no-default-features
  dll:
    # The DLL workspace, for the client's target.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p poe-hook -p poe-hook-core -p poe-hook-shared --target x86_64-pc-windows-msvc
      - run: cargo test -p poe-hook-shared
      - uses: actions/upload-artifact@v4
        with:
          name: dlls
          path: |
            target/x86_64-pc-windows-msvc/release/poe_hook.dll
            target/x86_64-pc-windows-msvc/release/poe_hook_core.dll
