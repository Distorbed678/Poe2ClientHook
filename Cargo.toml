# Client-side DLLs, built for x86_64-pc-windows-msvc (cargo-xwin on Linux; plain cargo on Windows).
# Own Cargo workspace; Poe2ModdingProject consumes it as the submodule modules/client-hook.
#   poe-hook        version.dll: proxy + permanent hooks (network guard, Vulkan, window) + loader
#   poe-hook-core   poe_hook_core.dll: features and the debug overlay; hot-reloadable
#   poe-hook-shared code and the loader <-> core ABI shared by both
#   poe-hook-sig    signature table matcher/resolver (pure Rust, host-buildable; also used by xtask)
#   poe-hook-mod-api the mod ABI (HookApi, no dependencies); poe-hook-mods mod.toml/state.toml/load plan
#                   (host-buildable); examples/sample-mod a tiny mod DLL (cdylib)
#   poe-hook-deploy host-side deployment (gateway list, poe-hook.toml, DLL install, Proton launch);
#                   builds on the host, not part of the DLLs
[workspace]
resolver = "3"
members = [
    "poe-hook",
    "poe-hook-core",
    "poe-hook-shared",
    "poe-hook-deploy",
    "poe-hook-sig",
    "poe-hook-mod-api",
    "poe-hook-mods",
    "examples/sample-mod",
]
# Host-buildable crates: a plain `cargo test` on Linux/Windows skips the DLLs.
# The nested Poe2Protocol checkout is its own workspace.
exclude = ["protocol"]
default-members = ["poe-hook-deploy", "poe-hook-sig", "poe-hook-mod-api", "poe-hook-mods"]

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "MIT"
publish = false

[workspace.dependencies]
poe-hook-shared = { path = "poe-hook-shared" }
poe-hook-sig = { path = "poe-hook-sig" }
poe-hook-mod-api = { path = "poe-hook-mod-api" }
poe-hook-mods = { path = "poe-hook-mods", default-features = false }
log = { version = "0.4", features = ["std", "serde"] }
ilhook = "2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
debug = 1

# The signature matcher scans the 78 MB game image: fast enough for the tests only optimised.
[profile.dev.package.poe-hook-sig]
opt-level = 3
